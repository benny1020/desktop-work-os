name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-and-contracts:
    name: Build, contracts and browser workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:adapters
      - run: npm run test:cold-review
      - run: npm test -- --workers=2
      - name: Install isolated accessibility checker
        run: npm install --prefix "$RUNNER_TEMP/worklane-axe" axe-core@4.11.1 --no-save --package-lock=false
      - name: Check rendered design and accessibility
        run: AXE_SCRIPT_PATH="$RUNNER_TEMP/worklane-axe/node_modules/axe-core/axe.min.js" node scripts/audit-design-quality.mjs
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-evidence
          path: |
            artifacts/test-report/
            test-results/
            artifacts/design-quality/
          retention-days: 7
